name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

      - name: Server tests
        shell: bash
        run: |
          FILL_WAIT=2 PORT=8787 bun run dist/server.js > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS http://127.0.0.1:8787/ | grep -q '<meta name="build"'
          bun tools/dj-check.ts | tee -a results.log
          bun tools/abuse.ts ws://127.0.0.1:8787/ws | tee -a results.log
          bun tools/queue-bots.ts 4 ws://127.0.0.1:8787/ws | tee -a results.log
          if grep -q FAIL results.log; then echo "::error::server tests failed"; cat server.log; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  rehearsal:
    name: VPS rehearsal (setup + deploy on a clean Ubuntu)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: One-time setup script
        run: sudo DEPLOY_PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIRehearsalKeyNotReal rehearsal" bash deploy/setup-vps.sh

      - name: First deploy (starts the server)
        shell: bash
        run: |
          REL=/opt/overclock/releases/rehearsal-1
          sudo -u deploy mkdir -p "$REL"
          sudo cp dist/index.html dist/server.js deploy/activate.sh "$REL/"
          sudo chown -R deploy:deploy "$REL"
          sudo -u deploy bash "$REL/activate.sh" rehearsal-1
          systemctl is-active overclock

      - name: Through nginx
        shell: bash
        run: |
          curl -fsS http://localhost/health
          curl -fsS http://localhost/ | grep -o '<meta name="build"[^>]*>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/nope)" = 404
          /usr/local/bin/bun tools/ws-check.ts ws://localhost/ws

      - name: Client-only redeploy keeps the server running
        shell: bash
        run: |
          PID=$(systemctl show -p MainPID --value overclock)
          REL=/opt/overclock/releases/rehearsal-2
          sudo -u deploy mkdir -p "$REL"
          sudo cp dist/server.js deploy/activate.sh "$REL/"
          sed 's/<title>/<title>v2 /' dist/index.html | sudo tee "$REL/index.html" >/dev/null
          sudo chown -R deploy:deploy "$REL"
          sudo -u deploy bash "$REL/activate.sh" rehearsal-2 | tee out.log
          grep -q "client-only" out.log
          test "$(systemctl show -p MainPID --value overclock)" = "$PID"
          curl -fsS http://localhost/ | grep -q '<title>v2 '

      - name: Server logs
        if: always()
        run: sudo journalctl -u overclock --no-pager -n 50 || true

  deploy:
    name: Deploy to VPS
    needs: [build, rehearsal]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check deploy settings
        id: cfg
        shell: bash
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy skipped. Add the VPS_HOST and VPS_SSH_KEY repository secrets to turn on auto-deploy (see README)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          name: dist
          path: dist

      - name: Set up SSH
        if: steps.cfg.outputs.skip != 'true'
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set, so the VPS host key is trusted on first sight. Set it to pin the key (see README)."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Upload release and activate
        if: steps.cfg.outputs.skip != 'true'
        shell: bash
        run: |
          REL="/opt/overclock/releases/${GITHUB_SHA}"
          ssh vps "mkdir -p '$REL'"
          scp dist/index.html dist/server.js deploy/activate.sh "vps:$REL/"
          ssh vps "bash '$REL/activate.sh' '${GITHUB_SHA}'"
