# /etc/nginx/sites-available/overclock
# Serves the single-file client and proxies the game WebSocket to the Bun server.
# Enable:  sudo ln -s /etc/nginx/sites-available/overclock /etc/nginx/sites-enabled/
# HTTPS:   sudo certbot --nginx -d game.example.com   (the client switches to wss:// on its own)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;          # <- your domain (or _ for any)

    root /opt/overclock/dist;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        tcp_nodelay on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        return 404;
    }
}
